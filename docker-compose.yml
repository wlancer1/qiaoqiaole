services:
  qiaoqiaole:
    build:
      context: .
      dockerfile: Dockerfile
    image: qiaoqiaole:latest
    container_name: qiaoqiaole
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8843:80"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: qiaoqiaole-api:latest
    container_name: qiaoqiaole-api
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      SQLITE_PATH: /data/qiaoqiaole.sqlite
      PORT: 3000
      QIAOQIAOLE_USERNAME: ${QIAOQIAOLE_USERNAME:?QIAOQIAOLE_USERNAME is required}
      QIAOQIAOLE_PASSWORD: ${QIAOQIAOLE_PASSWORD:?QIAOQIAOLE_PASSWORD is required}
      XHS_COOKIE: ${XHS_COOKIE:-}
      REDIS_URL: redis://redis:6379
      AUTH_PHONE_PEPPER: ${AUTH_PHONE_PEPPER:?AUTH_PHONE_PEPPER is required}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      ALIYUN_PNVS_ENABLED: ${ALIYUN_PNVS_ENABLED:-false}
      ALIYUN_PNVS_ACCESS_KEY_ID: ${ALIYUN_PNVS_ACCESS_KEY_ID:-}
      ALIYUN_PNVS_ACCESS_KEY_SECRET: ${ALIYUN_PNVS_ACCESS_KEY_SECRET:-}
      ALIYUN_PNVS_SCHEME_NAME: ${ALIYUN_PNVS_SCHEME_NAME:-}
      ALIYUN_PNVS_SIGN_NAME: ${ALIYUN_PNVS_SIGN_NAME:-}
      ALIYUN_PNVS_TEMPLATE_CODE: ${ALIYUN_PNVS_TEMPLATE_CODE:-}
      ALIYUN_PNVS_TEMPLATE_PARAM: '${ALIYUN_PNVS_TEMPLATE_PARAM:-{"code":"##code##","min":"5"}}'
      ALIYUN_PNVS_CODE_LENGTH: ${ALIYUN_PNVS_CODE_LENGTH:-6}
      ALIYUN_PNVS_VALID_TIME_SECONDS: ${ALIYUN_PNVS_VALID_TIME_SECONDS:-300}
      ALIYUN_PNVS_DUPLICATE_POLICY: ${ALIYUN_PNVS_DUPLICATE_POLICY:-1}
      ALIYUN_PNVS_INTERVAL_SECONDS: ${ALIYUN_PNVS_INTERVAL_SECONDS:-60}
      ALIYUN_PNVS_CODE_TYPE: ${ALIYUN_PNVS_CODE_TYPE:-1}
      ALIYUN_PNVS_ENDPOINT: ${ALIYUN_PNVS_ENDPOINT:-https://dypnsapi.aliyuncs.com/}
      AUTH_CAPTCHA_REQUIRED: ${AUTH_CAPTCHA_REQUIRED:-false}
      AUTH_CAPTCHA_PROVIDER: ${AUTH_CAPTCHA_PROVIDER:-tencent}
      TENCENT_CAPTCHA_APP_ID: ${TENCENT_CAPTCHA_APP_ID:-}
      TENCENT_CAPTCHA_APP_SECRET_KEY: ${TENCENT_CAPTCHA_APP_SECRET_KEY:-}
      TENCENT_COS_ENABLED: ${TENCENT_COS_ENABLED:-false}
      TENCENT_COS_SECRET_ID: ${TENCENT_COS_SECRET_ID:-}
      TENCENT_COS_SECRET_KEY: ${TENCENT_COS_SECRET_KEY:-}
      TENCENT_COS_BUCKET: ${TENCENT_COS_BUCKET:-}
      TENCENT_COS_REGION: ${TENCENT_COS_REGION:-ap-guangzhou}
      TENCENT_COS_KEY_PREFIX: ${TENCENT_COS_KEY_PREFIX:-uploads/images}
      TENCENT_COS_PRIVATE_DOMAIN: ${TENCENT_COS_PRIVATE_DOMAIN:-}
      TENCENT_COS_PROTOCOL: ${TENCENT_COS_PROTOCOL:-https}
      TENCENT_COS_SIGN_EXPIRES: ${TENCENT_COS_SIGN_EXPIRES:-900}
    volumes:
      - qiaoqiaole_data:/data

  redis:
    image: redis:7-alpine
    container_name: qiaoqiaole-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  qiaoqiaole_data:
  redis_data:

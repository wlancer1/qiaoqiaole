services:
  qiaoqiaole:
    build:
      context: .
      dockerfile: Dockerfile
    image: qiaoqiaole:latest
    container_name: qiaoqiaole
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8843:80"
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: qiaoqiaole-api:latest
    container_name: qiaoqiaole-api
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/qiaoqiaole.sqlite
      PORT: 3000
      REDIS_URL: redis://redis:6379
    volumes:
      - qiaoqiaole_data:/data

  redis:
    image: redis:7-alpine
    container_name: qiaoqiaole-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  qiaoqiaole_data:
  redis_data:

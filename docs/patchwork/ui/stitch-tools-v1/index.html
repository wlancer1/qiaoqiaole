function rail(mode){return '<aside class="rail">'+[['select','选择'],['pen','画笔'],['add','添加'],['fill','填布'],['layers','图层']].map(function(v){return '<button data-action="'+(v[0]==='pen'?'open-brush':'tool')+'" class="'+((mode==='properties'||mode==='edge'?v[0]==='select':v[0]==='pen')?'active':'')+'" aria-label="'+v[1]+'">'+icon(v[0])+'<span>'+v[1]+'</span></button>'}).join('')+'<button class="trash" data-action="demo" aria-label="清空画布">'+icon('trash')+'<span>清空</span></button></aside>'}
function topBar(){return '<header class="top"><button class="icon-button" data-action="demo" aria-label="返回">'+icon('back')+'</button><button class="size" data-action="demo">40 × 40 cm'+icon('down')+'</button><div class="undo"><button class="icon-button" data-action="demo" aria-label="撤销">'+icon('undo')+'</button><button class="icon-button" data-action="demo" aria-label="重做">'+icon('redo')+'</button></div><button class="top-action" data-action="demo">'+icon('download')+'导出</button><button class="top-action save" data-action="demo">'+icon('check')+'保存</button></header>'}
function sample(type,color){const path=type==='blanket'?'<path d="M5 15H70M10 15V6h7M25 15V6h7M40 15V6h7M55 15V6h7" stroke-width="1.5"/>':'<path d="M5 12H70" stroke-width="1.8" stroke-dasharray="'+(type==='running'?'6 5':'9 1.5')+'"/>';return '<svg viewBox="0 0 75 22" fill="none" stroke="'+(color||'#6688a1')+'" stroke-linecap="round" stroke-linejoin="round">'+path+'</svg>'}
function title(text,sub){return '<div class="grab"></div><div class="sheet-head"><strong>'+text+(sub?'<small>'+sub+'</small>':'')+'</strong><button class="close close-panel" data-action="close" aria-label="关闭设置">'+icon('close')+'</button></div>'}
function tabs(mode){return '<div class="mode-tabs" role="tablist" aria-label="画笔模式"><button role="tab" aria-selected="'+(mode==='shape')+'" class="'+(mode==='shape'?'on':'')+'" data-tab="shape">'+icon('free')+'形状</button><button role="tab" aria-selected="'+(mode==='thread')+'" class="'+(mode==='thread'?'on':'')+'" data-tab="thread">'+icon('thread')+'缝纫线</button></div>'}
function footer(label){return '<div class="footer"><button class="secondary" data-action="cancel">取消</button><button class="primary" data-action="apply">'+label+'</button></div>'}
function shapePanel(s){return title('画笔设置')+tabs('shape')+'<div class="field-title">绘制方式<small>拖动画出大小</small></div><div class="shape-options">'+[['free','自由绘制'],['rect','矩形'],['ellipse','椭圆'],['more',s.shape==='自由绘制'?'更多形状':s.shape]].map(function(v,i){return '<button data-shape="'+v[0]+'" class="shape-option '+(s.shapeKey===v[0]?'on':'')+'">'+icon(v[0])+'<span>'+(i===3&&s.shapeKey!=='more'?'更多形状':v[1])+'</span></button>'}).join('')+'</div><div class="field-title">当前布料</div><button class="fabric-choice" data-action="fabric"><span class="swatch rose"></span><span class="choice-copy"><b>玫瑰小格</b><small>点击更换布料</small></span>'+icon('right')+'</button><p class="hint">自由绘制：画出轮廓，松手自动闭合成布片。<br>基础形状：从起点拖到终点，确定位置与大小。</p>'+footer('开始绘制')}
function colors(s){return '<div class="field-title">线色<small class="current-color-label">'+s.colorName+'</small></div><div class="palette">'+[['#fff6e8','奶油白'],['#505b60','炭灰'],['#b96d82','豆沙粉'],['#7c9278','鼠尾草绿'],['#728ca6','雾蓝']].map(function(v){return '<button data-color="'+v[0]+'" data-color-name="'+v[1]+'" class="color '+(s.color===v[0]?'on ':'')+(v[0]==='#505b60'?'dark':'')+'" style="--color:'+v[0]+'" aria-label="'+v[1]+'"></button>'}).join('')+'<label class="custom-color" aria-label="自定义线色">＋<input type="color" value="'+s.color+'" data-input="color" aria-label="自定义线色"></label></div>'}
function threadPanel(s,edge){const label=edge?'布片周边缝线':'画笔设置';return title(label,edge?'花朵 · 已选 1 片':null)+(edge?'<div class="edge-toggle"><span>沿轮廓缝一圈</span><button class="switch '+(!s.enabled?'off':'')+'" role="switch" aria-checked="'+s.enabled+'" aria-label="沿轮廓缝一圈" data-action="toggle"></button></div>':tabs('thread'))+'<div class="field-title">针迹<small>跟随路径排列</small></div><div class="stitch-options">'+[['running','平针'],['back','回针'],['blanket','锁边针']].map(function(v){return '<button class="stitch-option '+(s.style===v[0]?'on':'')+'" data-style="'+v[0]+'">'+sample(v[0])+'<span>'+v[1]+'</span></button>'}).join('')+'</div>'+colors(s)+'<div class="setting-row"><span>粗细</span><div class="weight-controls">'+[['fine','细'],['medium','中'],['bold','粗']].map(function(v){return '<button data-weight="'+v[0]+'" class="'+(s.weight===v[0]?'on':'')+'">'+v[1]+'</button>'}).join('')+'</div></div>'+(edge?'<div class="setting-row"><span>距边缘</span><span class="inside-tag">内侧</span><div class="distance"><button data-offset="-0.5" aria-label="减少距边缘">−</button><output>'+s.offset+'</output><span class="unit">mm</span><button data-offset="0.5" aria-label="增加距边缘">＋</button></div></div>':'<p class="hint">沿手势画一条缝线，松手结束，可连续画下一条。</p>')+'<button class="more" data-action="advanced">更多设置<span>针长 '+s.length+' mm · 针距 '+s.gap+' mm'+icon('right')+'</span></button><div class="advanced" '+(!s.advanced?'hidden':'')+'><label>针长（mm）<input type="number" min=".5" max="12" step=".5" value="'+s.length+'" data-input="length"></label><label>针距（mm）<input type="number" min=".5" max="12" step=".5" value="'+s.gap+'" data-input="gap"></label></div>'+footer(edge?'应用到布片':'开始画缝线')}
function propertiesPanel(s){return title('布片属性')+'<label class="property-field">名称<input value="花朵" aria-label="布片名称"></label><button class="fabric-choice" data-action="fabric"><span class="swatch rose"></span><span class="choice-copy"><b>布料</b><small>玫瑰小格</small></span>'+icon('right')+'</button><div class="property-grid"><label class="property-field">宽（cm）<input value="15.4" type="number"></label><label class="property-field">高（cm）<input value="15.4" type="number"></label></div><button class="props-entry" data-action="open-edge"><span class="round-icon">'+icon('thread')+'</span><span class="choice-copy"><b>缝纫线</b><small>'+(!s.enabled?'未添加':({running:'平针',back:'回针',blanket:'锁边针'}[s.style])+' · '+s.colorName+' · 内侧 '+s.offset+' mm')+'</small></span><span class="preview-line">'+sample(s.style)+'</span>'+icon('right')+'</button><button class="geometry-link" data-action="demo">位置、旋转与缝份设置…</button>'+footer('完成')}
function libraryPanel(s){return title('选择形状')+'<div class="shape-library">'+[['rect','正方形'],['ellipse','圆形'],['triangle','三角形'],['diamond','菱形'],['heart','爱心'],['star','五角星'],['hex','六边形'],['free','自定义形状']].map(function(v){return '<button data-library-shape="'+v[1]+'">'+icon(v[0])+'<span>'+v[1]+'</span></button>'}).join('')+'<p class="hint" style="grid-column:1/-1;margin-top:7px">选择后拖动画出大小，或进入属性精确调整。</p></div>'+footer('返回画笔')}
function bodyPanel(s){if(s.panel==='shape')return shapePanel(s);if(s.panel==='thread')return threadPanel(s,false);if(s.panel==='properties')return propertiesPanel(s);if(s.panel==='edge')return threadPanel(s,true);return libraryPanel(s)}
function renderScene(scene){const id=scene.id;states[id]={panel:id,mode:id==='shape'?'shape':'thread',style:'running',color:id==='thread'?'#728ca6':'#fff6e8',colorName:id==='thread'?'雾蓝':'奶油白',weight:'fine',offset:3,length:3,gap:2,enabled:id!=='properties',advanced:false,shape:'自由绘制',shapeKey:'free',baseline:null};return '<article class="scene" data-scene-card="'+id+'"><div class="scene-label"><b>'+scene.number+' / '+scene.title+'</b><span>390 × 844</span></div><div class="phone" data-scene="'+id+'" data-id="'+id+'">'+topBar()+art(id)+rail(id)+'<button class="tool-chip" data-action="open-brush">'+icon(id==='shape'?'free':'thread')+'<span>'+(id==='shape'?'形状 · 自由绘制':id==='thread'?'缝纫线 · 平针':'已选中花朵布片')+'</span>'+icon('down')+'</button><div class="zoom"><span>−</span>100%<span>＋</span>适应</div><div class="materials"><button class="material-entry" data-action="fabric">'+icon('palette')+'布料</button><span class="swatch rose selected"></span><span class="swatch sage"></span><span class="swatch ivory"></span><span class="swatch blue"></span><span class="swatch dot"></span></div><div class="scrim"></div><section class="sheet" role="dialog" aria-label="'+scene.title+'" aria-modal="true">'+bodyPanel(states[id])+'</section><button class="open-settings" hidden data-action="reopen">调整设置</button><div class="toast" hidden role="status"></div></div><p class="scene-note">'+scene.desc+'</p></article>'}
document.getElementById('gallery').innerHTML=scenes.map(renderScene).join('');
function snapshot(s){const copy={};Object.keys(s).forEach(function(k){if(k!=='baseline')copy[k]=s[k]});return copy}
Object.keys(states).forEach(function(id){states[id].baseline=snapshot(states[id])});
function refresh(phone){const s=states[phone.dataset.id];phone.querySelector('.sheet').innerHTML=bodyPanel(s);preview(phone)}
function preview(phone){const s=states[phone.dataset.id];phone.dataset.drawmode=(phone.dataset.scene==='shape'||phone.dataset.scene==='thread')?s.mode:'none';const ghost=phone.querySelector('.draw-ghost path');ghost.setAttribute('d',s.shapeKey==='rect'?'M105 92H147V125H105Z':s.shapeKey==='ellipse'?'M105 108a21 16 0 1 0 42 0a21 16 0 1 0-42 0':'M105 108C98 91 121 83 135 95S147 121 130 126 111 123 105 108Z');const edge=phone.querySelector('.edge-preview'),isEdge=s.panel==='edge'||phone.dataset.scene==='edge'||phone.dataset.scene==='properties';if(isEdge){edge.style.display=s.enabled?'':'none';const scale=1-(s.offset-3)*.014;edge.setAttribute('transform','translate(224 169) scale('+scale+') translate(-224 -169)')}const target=isEdge?phone.querySelector('.edge-thread'):phone.querySelector('.free-needle');target.setAttribute('stroke',s.color);target.style.stroke=s.color;target.style.strokeWidth={fine:1.8,medium:2.6,bold:3.5}[s.weight];target.style.strokeDasharray=s.style==='running'?(s.length*1.4)+' '+(s.gap*1.4):s.style==='back'?'10 1.5':'5 3';if(isEdge&&s.style==='blanket'){let path=edge.querySelector('.blanket-ticks');if(!path){path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('class','blanket-ticks');path.setAttribute('fill','none');edge.appendChild(path)}const d=[];for(let i=0;i<42;i++){const a=i*Math.PI*2/42,r=37+9*Math.cos(6*a);d.push('M'+(224+Math.cos(a)*(r-4)).toFixed(2)+','+(169+Math.sin(a)*(r-4)).toFixed(2)+'L'+(224+Math.cos(a)*r).toFixed(2)+','+(169+Math.sin(a)*r).toFixed(2))}path.setAttribute('d',d.join(''));path.setAttribute('stroke',s.color);path.setAttribute('stroke-width','1.4')}else{const old=edge.querySelector('.blanket-ticks');if(old)old.remove()}phone.querySelector('.tool-chip span').textContent=phone.dataset.scene==='properties'||phone.dataset.scene==='edge'?'已选中花朵布片':s.mode==='shape'?'形状 · '+s.shape:'缝纫线 · '+({running:'平针',back:'回针',blanket:'锁边针'}[s.style])}
function toast(phone,text){const el=phone.querySelector('.toast');el.textContent=text;el.hidden=false;clearTimeout(el.timer);el.timer=setTimeout(function(){el.hidden=true},1900)}
function closePanel(phone){phone.querySelector('.sheet').hidden=true;phone.querySelector('.scrim').hidden=true;phone.querySelector('.open-settings').hidden=false}
function openPanel(phone,panel){const s=states[phone.dataset.id];s.returnPanel=s.panel==='properties'&&panel==='edge'?'properties':null;s.panel=panel;s.baseline=snapshot(s);phone.querySelector('.sheet').hidden=false;phone.querySelector('.scrim').hidden=false;phone.querySelector('.open-settings').hidden=true;refresh(phone)}
document.addEventListener('click',function(event){const filter=event.target.closest('[data-filter]');if(filter){document.getElementById('gallery').classList.toggle('single',filter.dataset.filter!=='all');document.querySelectorAll('[data-filter]').forEach(function(b){b.classList.toggle('on',b===filter)});document.querySelectorAll('.scene').forEach(function(card){card.hidden=filter.dataset.filter!=='all'&&card.dataset.sceneCard!==filter.dataset.filter});return}const phone=event.target.closest('.phone');if(!phone)return;const s=states[phone.dataset.id],button=event.target.closest('button');if(event.target.classList.contains('scrim')){Object.assign(s,s.baseline);preview(phone);if(s.returnPanel==='properties')openPanel(phone,'properties');else closePanel(phone);return}if(!button)return;
if(button.dataset.tab){s.mode=button.dataset.tab;s.panel=s.mode;refresh(phone);return}
if(button.dataset.style){s.style=button.dataset.style;refresh(phone);return}
if(button.dataset.color){s.color=button.dataset.color;s.colorName=button.dataset.colorName;refresh(phone);return}
if(button.dataset.weight){s.weight=button.dataset.weight;refresh(phone);return}
if(button.dataset.offset){s.offset=Math.max(0,Math.min(12,Number((s.offset+Number(button.dataset.offset)).toFixed(1))));refresh(phone);return}
if(button.dataset.shape){if(button.dataset.shape==='more'){s.panel='library';refresh(phone)}else{s.shapeKey=button.dataset.shape;s.shape={free:'自由绘制',rect:'矩形',ellipse:'椭圆'}[s.shapeKey];refresh(phone)}return}
if(button.dataset.libraryShape){s.shape=button.dataset.libraryShape;s.shapeKey='more';s.mode='shape';s.panel='shape';refresh(phone);return}
switch(button.dataset.action){case'advanced':s.advanced=!s.advanced;refresh(phone);break;case'toggle':s.enabled=!s.enabled;refresh(phone);break;case'open-edge':openPanel(phone,'edge');break;case'open-brush':openPanel(phone,s.mode);break;case'reopen':openPanel(phone,s.panel);break;case'close':case'cancel':Object.assign(s,s.baseline);preview(phone);if(s.returnPanel==='properties')openPanel(phone,'properties');else closePanel(phone);break;case'apply':if(s.panel==='library'){s.panel='shape';refresh(phone);break}s.baseline=snapshot(s);const appliedPanel=s.panel;const backToProps=s.returnPanel==='properties';if(backToProps)openPanel(phone,'properties');else closePanel(phone);toast(phone,appliedPanel==='edge'?(s.enabled?'已应用布片周边缝线':'已移除布片周边缝线'):s.panel==='properties'?'布片设置已应用':s.mode==='shape'?'已切换为形状画笔':'已切换为缝纫线画笔');break;case'fabric':toast(phone,'此处复用现有布料选择器');break;case'tool':toast(phone,'设计稿展示画笔与缝线设置');break;default:toast(phone,'交互设计预览，未修改作品')}
});
document.addEventListener('input',function(event){const input=event.target.closest('[data-input]');if(!input)return;const phone=input.closest('.phone'),s=states[phone.dataset.id];if(input.dataset.input==='color'){s.color=input.value;s.colorName='自定义';phone.querySelector('.current-color-label').textContent='自定义'}else{const value=Number(input.value);if(!Number.isFinite(value)||value<.5||value>12)return;s[input.dataset.input]=value}preview(phone)});
document.addEventListener('keydown',function(event){if(event.key!=='Escape'||event.isComposing)return;document.querySelectorAll('.phone').forEach(function(phone){if(phone.querySelector('.sheet').hidden)return;const s=states[phone.dataset.id];Object.assign(s,s.baseline);preview(phone);closePanel(phone)})});
document.querySelectorAll('.phone').forEach(preview);
</script>
</body>

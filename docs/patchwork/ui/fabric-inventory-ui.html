<script>
const icon=(name,cls='')=>'<svg class="ico '+cls+'"><use href="#i-'+name+'"/></svg>';
const fabric=(name)=>'./assets/'+name+'.svg';
const img=(name,extra='')=>'<img src="'+fabric(name)+'" alt="'+extra+'">';
const nav=(active)=>'<nav class="fixed-nav"><button '+(active==='home'?'class="active"':'data-demo-toast="首页仅为导航示意"')+'>'+icon('home')+'首页</button><button '+(active==='editor'?'class="active"':'data-goto="editor"')+'>'+icon('scissors')+'拼布设计</button><button '+(active==='mine'?'class="active"':'data-goto="warehouse"')+'>'+icon('user')+'我的</button></nav>';
const head=(title,back,action='')=>'<header class="page-header"><button class="icon-button" data-goto="'+back+'" aria-label="返回">'+icon('back')+'</button><strong>'+title+'</strong>'+(action||'<span style="width:35px"></span>')+'</header>';
const bottom=(main,action,caption='')=>'<footer class="bottom-fixed"><button class="primary" data-goto="'+action+'">'+main+'</button>'+(caption?'<p class="foot-note">'+caption+'</p>':'')+'</footer>';
const fabricCard=(id,name,amount,attr='',go='detail')=>'<div class="fabric-card" data-goto="'+go+'"><div class="thumb">'+img(id,name)+'</div><div class="fabric-info"><b>'+name+'</b><small '+(attr?'class="'+attr+'"':'')+'>'+amount+'</small></div></div>';
const status='<div class="statusbar"><span>9:41</span><span class="status-right">▮▮▮ &nbsp; ◉ &nbsp; ▰</span></div>';
const swatches=[['rose-floral','粉色碎花'],['sage-leaves','鼠尾草绿'],['blue-gingham','蓝色格纹']];
function editorBase(type){
 const defs='<defs><pattern id="pat-r-'+type+'" width="80" height="80" patternUnits="userSpaceOnUse"><image href="'+fabric('rose-floral')+'" width="80" height="80"/></pattern><pattern id="pat-s-'+type+'" width="80" height="80" patternUnits="userSpaceOnUse"><image href="'+fabric('sage-leaves')+'" width="80" height="80"/></pattern><pattern id="pat-b-'+type+'" width="80" height="80" patternUnits="userSpaceOnUse"><image href="'+fabric('blue-gingham')+'" width="80" height="80"/></pattern><pattern id="pat-y-'+type+'" width="80" height="80" patternUnits="userSpaceOnUse"><image href="'+fabric('marigold')+'" width="80" height="80"/></pattern></defs>';
 const p='<path d="M133 176Q48 160 54 87Q107 90 145 164Z" fill="url(#pat-r-'+type+')" stroke="#cf9fa8" stroke-width="2"/><path d="M140 175Q174 95 241 74Q250 162 149 181Z" fill="url(#pat-s-'+type+')" stroke="#8aa99a" stroke-width="2"/><path d="M136 183Q75 211 92 297Q160 281 155 185Z" fill="url(#pat-b-'+type+')" stroke="#8299b0" stroke-width="2"/><path d="M145 186Q206 205 236 283Q161 293 139 199Z" fill="url(#pat-y-'+type+')" stroke="#dfac65" stroke-width="2"/>';
 const warn=type==='editor';
 return '<div class="editor-header"><button class="icon-button" data-goto="warehouse">'+icon('back')+'</button><span class="editor-size">20 × 20 cm ⌄</span><div class="editor-header-actions"><button>'+icon('undo')+'</button><button class="save-mini" data-demo-toast="仅保存设计，不会扣减库存">保存</button></div></div><div class="editor-stage"><div class="editor-rail"><button class="tool active">'+icon('box')+'选择</button><button class="tool" data-goto="picker">'+icon('plus')+'添加</button><button class="tool" data-goto="picker">'+icon('paint')+'填布</button><button class="tool" data-goto="requirements">'+icon('layers')+'图层</button></div>'
 +(warn?'<div class="alert-floating" data-goto="requirements"><span>'+icon('alert','s')+'当前作品缺少 1 种布料</span>'+icon('next','s')+'</div>':'')
 +'<div class="board-canvas" style="'+(warn?'top:94px;height:346px':'top:50px;height:360px')+'"><div class="board-grid"></div><svg class="board-svg" viewBox="0 0 270 350">'+defs+p
 +(warn?'<path d="M145 186Q206 205 236 283Q161 293 139 199Z" fill="none" stroke="#dd4758" stroke-width="3.5" stroke-dasharray="6 4"/>':'')
 +'<circle cx="144" cy="184" r="20" fill="#f6d6b3" stroke="#e2b186" stroke-width="1.8"/><circle cx="144" cy="184" r="5" fill="#d8ab8f"/></svg>'
 +(warn?'<div class="board-alert">'+icon('alert','s')+'黄色小花 · 缺少</div>':'')+'</div>'
 +(warn?'<div class="missing-tip"><div><b>需要补充布料</b><br><span>黄色小花 · 预计 0.12 m²</span></div><button data-goto="requirements">查看用料 →</button></div>':'')

}
const screens=[
{id:'warehouse',title:'01 / 我的布料仓库',en:'INVENTORY OVERVIEW',cls:'warehouse-page',html:

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-goto],[data-demo-toast],.chip');
 if(!t)return;
 if(t.dataset.goto){document.querySelector('#'+t.dataset.goto)?.scrollIntoView({behavior:'smooth',block:'center'});return;}
 if(t.classList.contains('chip')){const par=t.parentElement;par.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));t.classList.add('active');return;}
 const toast=document.querySelector('#toast');toast.textContent=t.dataset.demoToast;toast.classList.add('show');clearTimeout(window.__toastTimeout);window.__toastTimeout=setTimeout(()=>toast.classList.remove('show'),1700);
});
